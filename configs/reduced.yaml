# Reduced profile for the deadline: the full task set, one sampled episode per task per seed.
# Runs with this config are labelled reduced. See docs/DECISIONS.md, 2026-11-15 and 2026-11-16.
label: reduced
profile: full
model_id: Qwen/Qwen2.5-1.5B-Instruct
gen:
  max_new_tokens: 256
  temperature: 0.7
  max_tool_rounds: 8
  max_rows: 20
  timeout_s: 2.0
exp0:
  n_samples: 1
sft:
  num_train_epochs: 3
  learning_rate: 2.0e-4
  batch_size: 1
  grad_accum: 2
  max_length: 3072
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj]
heal:
  condition: neutral
  rounds: 2
  collect_per_round: 40
  gate_tasks: 12
  eval_samples: 1
  iso_m: 2
  start_adapter: runs/seedpolicy_reduced_seed{seed}/adapter
seeding:
  mix: [gold, E1, gold, E2, gold, E4]   # half honest, one sixth each exploit kind
